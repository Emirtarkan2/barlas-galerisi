<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barlas Galerisi</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    margin-bottom:10px;
}

.butonkutu{
    margin:20px 0;
}

button{
    padding:12px 20px;
    font-size:16px;
    margin:5px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

#ekleBtn{
    background:#4CAF50;
    color:white;
}

#silBtn{
    background:#f44336;
    color:white;
}

#galeri{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:15px;
    margin-top:20px;
}

.foto{
    background:white;
    border:3px solid #444;
    border-radius:10px;
    padding:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.foto img{
    width:100%;
    height:auto;
    border-radius:8px;
}

.foto p{
    font-weight:bold;
    margin-top:8px;
}

@media(max-width:900px){
    #galeri{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:600px){
    #galeri{
        grid-template-columns:repeat(2,1fr);
    }

    button{
        width:90%;
    }
}

</style>

</head>

<body>

<h1>Barlas Galerisi</h1>

<p>V tuşuna bas veya Fotoğraf Ekle butonuna dokun.</p>
<p>B tuşuna bas veya Galeriyi Temizle butonuna dokun.</p>

<div class="butonkutu">
    <button id="ekleBtn">📷 Fotoğraf Ekle</button>
    <button id="silBtn">🗑️ Galeriyi Temizle</button>

```
<button onclick="muzikCal()">🎵 Müziği Başlat</button>
<button onclick="muzikDur()">🔇 Müziği Durdur</button>
```

</div>

<audio id="muzik" autoplay loop>
    <source src="aklimi-aldi-gitti-yakuptv.mp3" type="audio/mpeg">
</audio>

<div id="galeri"></div>

<script>

const resimler = [

"barlas peker.jpg",

"picasso barlas.png",
"kız barlas.png",
"gülen barlas.png",
"arkadaş barlas.png",

"barlas abi.png",
"barlas arkadaş.png",
"bebe baris.png",
"bly.png",
"furki.png"

];

let index = 0;

const galeri = document.getElementById("galeri");
const muzik = document.getElementById("muzik");

function muzikCal(){
    muzik.play();
}

function muzikDur(){
    muzik.pause();
}

window.addEventListener("load", () => {
    muzik.play().catch(() => {
        console.log("Otomatik oynatma engellendi.");
    });
});

function fotografEkle(){

    if(index < resimler.length){

        const kutu = document.createElement("div");

        kutu.className = "foto";

        kutu.innerHTML = `
            <img src="${resimler[index]}" alt="Barlas">
            <p>Barlas</p>
        `;

        galeri.appendChild(kutu);

        index++;
    }
}

function temizle(){

    galeri.innerHTML = "";
    index = 0;

}

document.getElementById("ekleBtn")
.addEventListener("click", fotografEkle);

document.getElementById("silBtn")
.addEventListener("click", temizle);

document.addEventListener("keydown", function(e){

    if(e.key.toLowerCase() === "v"){
        fotografEkle();
    }

    if(e.key.toLowerCase() === "b"){
        temizle();
    }

});

</script>

</body>
</html>
